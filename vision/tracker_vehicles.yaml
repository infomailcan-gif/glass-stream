# Arac takibi (BoT-SORT). Ultralytics'in varsayilan takipcisi (tracktrack) yeni bir araci
# takibe almak icin %70 guven istiyor; uzak / kucuk araclar hic takibe alinmiyor ve
# kaydedilmiyordu. Burada esikler dusuk tutulur.
tracker_type: botsort
track_high_thresh: 0.25
track_low_thresh: 0.1
new_track_thresh: 0.3
track_buffer: 60
match_thresh: 0.8
fuse_score: True
gmc_method: sparseOptFlow
proximity_thresh: 0.5
appearance_thresh: 0.8
with_reid: False
model: auto
