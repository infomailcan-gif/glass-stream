# XcodeGen proje tanimi. GitHub Actions'ta `xcodegen generate` ile
# GlassBridge.xcodeproj uretilir (Mac'e gerek yok).
name: GlassBridge
options:
  bundleIdPrefix: com.glassstream
  deploymentTarget:
    iOS: "17.2"
packages:
  MWDAT:
    url: https://github.com/facebook/meta-wearables-dat-ios
    exactVersion: 1.0.1
targets:
  GlassBridge:
    type: application
    platform: iOS
    sources:
      - path: GlassBridge
        excludes:
          - Info.plist
    settings:
      base:
        INFOPLIST_FILE: GlassBridge/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        PRODUCT_BUNDLE_IDENTIFIER: com.glassstream.bridge
        MARKETING_VERSION: "0.9.2"
        CURRENT_PROJECT_VERSION: "15"
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
        META_APP_ID: "0"
        CLIENT_TOKEN: ""
    dependencies:
      - package: MWDAT
        product: MWDATCore
      - package: MWDAT
        product: MWDATCamera
    scheme: {}
